name: PR/CI Check

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release*

env:
  NODE_VERSION: '22.21.1'

jobs:
  api-compatibility:
    name: API package compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify API release inputs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/api-changed-files"
          if grep -Eq '^(src/(api|types|publicErrors|capabilities|legacyCapabilities)\.ts$|api/(package(-lock)?\.json$|runtime/|scripts/|test/|tsconfig|\.npmignore$)|\.github/workflows/pr-(check|file-check)\.yml$|build/azure-pipeline\.npm\.yml$)' "$RUNNER_TEMP/api-changed-files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: npm ci
        working-directory: api

      - name: Validate declared extension minimum
        if: steps.scope.outputs.relevant == 'true'
        run: npm run check:release
        working-directory: api

      - name: Build and test API package
        if: steps.scope.outputs.relevant == 'true'
        run: npm run compile && npm test
        working-directory: api

  build-vsix:
    name: Create VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build VSIX
        uses: ./.github/actions/build-vsix
        with:
          node_version: ${{ env.NODE_VERSION }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint -- api/runtime api/scripts api/test

  ts-unit-tests:
    name: TypeScript Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Tests
        run: npm run pretest

      - name: Localization
        run: npx @vscode/l10n-dev@latest export ./src

      - name: Run Tests
        run: npm run unittest

  smoke-tests:
    name: Smoke Tests
    runs-on: ${{ matrix.os }}
    needs: [build-vsix]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Python Environment Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'microsoft/python-environment-tools'
          path: 'python-env-tools-src'
          sparse-checkout: |
            crates
            Cargo.toml
            Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            python-env-tools-src/target
          key: ${{ runner.os }}-cargo-pet-${{ hashFiles('python-env-tools-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pet-

      - name: Build Python Environment Tools
        run: cargo build --release --package pet
        working-directory: python-env-tools-src

      - name: Copy pet binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet python-env-tools/bin/
          chmod +x python-env-tools/bin/pet

      - name: Copy pet binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet.exe python-env-tools/bin/
        shell: bash

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Compile Tests
        run: npm run compile-tests

      - name: Run Smoke Tests (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/run-linux-tests
        with:
          script: smoke-test
          artifact-name: smoke-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_attempt }}

      - name: Run Smoke Tests (non-Linux)
        if: runner.os != 'Linux'
        run: npm run smoke-test

  e2e-tests:
    name: E2E Tests
    runs-on: ${{ matrix.os }}
    needs: [smoke-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Python Environment Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'microsoft/python-environment-tools'
          path: 'python-env-tools-src'
          sparse-checkout: |
            crates
            Cargo.toml
            Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            python-env-tools-src/target
          key: ${{ runner.os }}-cargo-pet-${{ hashFiles('python-env-tools-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pet-

      - name: Build Python Environment Tools
        run: cargo build --release --package pet
        working-directory: python-env-tools-src

      - name: Copy pet binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet python-env-tools/bin/
          chmod +x python-env-tools/bin/pet

      - name: Copy pet binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet.exe python-env-tools/bin/
        shell: bash

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Compile Tests
        run: npm run compile-tests

      - name: Run E2E Tests (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/run-linux-tests
        with:
          script: e2e-test
          artifact-name: e2e-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_attempt }}

      - name: Run E2E Tests (non-Linux)
        if: runner.os != 'Linux'
        run: npm run e2e-test

  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    needs: [smoke-tests]
    env:
      CONDA_PLUGINS_AUTO_ACCEPT_TOS: 'true'
      VSC_PYTHON_PACKAGE_NETWORK_TEST: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Python Environment Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'microsoft/python-environment-tools'
          path: 'python-env-tools-src'
          sparse-checkout: |
            crates
            Cargo.toml
            Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            python-env-tools-src/target
          key: ${{ runner.os }}-cargo-pet-${{ hashFiles('python-env-tools-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pet-

      - name: Build Python Environment Tools
        run: cargo build --release --package pet
        working-directory: python-env-tools-src

      - name: Copy pet binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet python-env-tools/bin/
          chmod +x python-env-tools/bin/pet

      - name: Copy pet binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet.exe python-env-tools/bin/
        shell: bash

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Compile Tests
        run: npm run compile-tests

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: ''
          auto-activate: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Run Integration Tests (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/run-linux-tests
        with:
          script: integration-test
          artifact-name: integration-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_attempt }}

      - name: Run Integration Tests (macOS)
        if: runner.os == 'macOS'
        run: npm run integration-test

      - name: Run Integration Tests (Windows)
        id: windows-integration-tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VSCODE_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}\vsct-diag
        run: |
          New-Item -ItemType Directory -Force -Path $env:VSCODE_TEST_DIAGNOSTICS_DIR | Out-Null
          npm run integration-test 2>&1 | Tee-Object -FilePath (Join-Path $env:VSCODE_TEST_DIAGNOSTICS_DIR 'launcher.log')
          $testExitCode = $LASTEXITCODE
          exit $testExitCode

      - name: Upload Windows integration-test failure diagnostics
        if: ${{ failure() && steps.windows-integration-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\vsct-diag
          if-no-files-found: error
          retention-days: 7

  integration-tests-multiroot:
    name: Integration Tests (Multi-Root)
    runs-on: ${{ matrix.os }}
    needs: [smoke-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Compile Tests
        run: npm run compile-tests

      - name: Run Integration Tests Multi-Root (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/run-linux-tests
        with:
          script: integration-test-multiroot
          artifact-name: integration-multiroot-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_attempt }}

      - name: Run Integration Tests Multi-Root (non-Linux)
        if: runner.os != 'Linux'
        run: npm run integration-test-multiroot

name: PR/CI Check

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release*

env:
  NODE_VERSION: '22.21.1'

jobs:
  packaged-compatibility-adapter:
    name: Packaged compatibility adapter
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check report adapter and negative controls
        run: python -m unittest discover -s build/releaseCompatibility -p "test_*.py" -v

  packaged-draft-inputs:
    name: Prepare pinned packaged draft inputs
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    needs: [packaged-compatibility-adapter]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.scope.outputs.enabled }}
      inputs_sha256: ${{ steps.prepare.outputs.inputs_sha256 }}
      driver_sha256: ${{ steps.prepare.outputs.driver_sha256 }}
      candidate_sha256: ${{ steps.prepare.outputs.candidate_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact candidate source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: environments
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Read explicit draft verification scope and immutable pins
        id: scope
        env:
          DRAFT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python environments/build/releaseCompatibility/draft_ci.py describe \
            --config environments/build/releaseCompatibility/draft-inputs.json \
            --pull-request "$DRAFT_PR_NUMBER" --draft true

      - name: Checkout reviewed immutable harness snapshot
        if: steps.scope.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.scope.outputs.harness_repository }}
          ref: ${{ steps.scope.outputs.harness_commit }}
          path: harness-source
          persist-credentials: false

      - name: Select Node
        if: steps.scope.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build self-contained reviewed harness from its existing lock
        if: steps.scope.outputs.enabled == 'true'
        working-directory: harness-source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:releaseCompatibility
          npm run package:releaseCompatibility -- "$RUNNER_TEMP/reviewed-harness.zip"

      - name: Normally package the exact candidate head for Windows x64
        if: steps.scope.outputs.enabled == 'true'
        working-directory: environments
        run: |
          npm ci --no-audit --no-fund
          npx --no-install vsce package --target win32-x64 --pre-release --out "$RUNNER_TEMP/environments-candidate.vsix"

      - name: Freeze candidate, reviewed harness and exact released partners
        id: prepare
        if: steps.scope.outputs.enabled == 'true'
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python environments/build/releaseCompatibility/draft_ci.py prepare \
            --config environments/build/releaseCompatibility/draft-inputs.json \
            --source-root environments --source-repository "$SOURCE_REPOSITORY" --source-head "$SOURCE_HEAD" \
            --harness-root harness-source --candidate "$RUNNER_TEMP/environments-candidate.vsix" \
            --harness "$RUNNER_TEMP/reviewed-harness.zip" --output "$RUNNER_TEMP/packaged-draft-inputs"

      - name: Retain truthful preparation status
        if: always()
        env:
          PREPARATION_STATUS: ${{ job.status }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          REQUESTED: ${{ steps.scope.outputs.enabled }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "packaged-draft-inputs"
          root.mkdir(parents=True, exist_ok=True)
          (root / "preparation-status.json").write_text(json.dumps({
              "scope": "draft-ci-preparation",
              "workflowJobStatus": os.environ["PREPARATION_STATUS"],
              "requested": os.environ["REQUESTED"],
              "sourceHead": os.environ["SOURCE_HEAD"],
              "runtimeValidated": False,
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Preserve immutable inputs or preparation failure evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-draft-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packaged-draft-inputs
          if-no-files-found: error
          retention-days: 7

  packaged-draft-compatibility:
    name: Installed packaged compatibility (draft, Windows x64)
    if: needs.packaged-draft-inputs.outputs.enabled == 'true'
    needs: [packaged-draft-inputs]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download only this run's frozen inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.packaged-draft-inputs.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/packaged-draft-inputs

      - name: Select Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Select fixture Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Execute the real adapter against the original packaged bytes
        env:
          INPUTS_SHA256: ${{ needs.packaged-draft-inputs.outputs.inputs_sha256 }}
          DRIVER_SHA256: ${{ needs.packaged-draft-inputs.outputs.driver_sha256 }}
          CANDIDATE_SHA256: ${{ needs.packaged-draft-inputs.outputs.candidate_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $inputs = Join-Path $env:RUNNER_TEMP 'packaged-draft-inputs'
          $driver = Join-Path $inputs 'adapter\report.py'
          $candidate = Join-Path $inputs 'candidate\environments.vsix'
          if ((Get-FileHash -LiteralPath $driver -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:DRIVER_SHA256) {
            throw 'The adapter does not match the reviewed source-head artifact'
          }
          if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256) {
            throw 'The candidate bytes changed between preparation and execution'
          }
          python $driver --candidate-directory (Join-Path $inputs 'candidate') `
            --inputs (Join-Path $inputs 'inputs.zip') --inputs-sha256 $env:INPUTS_SHA256 `
            --output (Join-Path $env:RUNNER_TEMP 'packaged-draft-result')
          exit $LASTEXITCODE

      - name: Retain execution status even if the runner could not start
        if: always()
        env:
          EXECUTION_STATUS: ${{ job.status }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'packaged-draft-result'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $report = Join-Path $root 'adapter-report.json'
          $status = if (Test-Path -LiteralPath $report) {
            (Get-Content -LiteralPath $report -Raw | ConvertFrom-Json).status
          } else {
            'infrastructure-error'
          }
          @{
            scope = 'draft-ci-unsigned-source-head'
            workflowJobStatus = $env:EXECUTION_STATUS
            compatibilityStatus = $status
            sourceHead = $env:SOURCE_HEAD
            finalSignedArtifactValidated = $false
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'execution-status.json') -Encoding utf8

      - name: Preserve reports, provenance, execution results and raw host logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-draft-evidence-win32-x64-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/packaged-draft-result/adapter-report.json
            ${{ runner.temp }}/packaged-draft-result/plan.json
            ${{ runner.temp }}/packaged-draft-result/runner.log
            ${{ runner.temp }}/packaged-draft-result/execution-status.json
            ${{ runner.temp }}/packaged-draft-result/inputs/provenance.json
            ${{ runner.temp }}/packaged-draft-result/runner/report.json
            ${{ runner.temp }}/packaged-draft-result/runner/**/result.json
            ${{ runner.temp }}/packaged-draft-result/runner/**/host-report.json
            ${{ runner.temp }}/packaged-draft-result/runner/**/case.json
            ${{ runner.temp }}/packaged-draft-result/runner/**/process.log
            ${{ runner.temp }}/packaged-draft-result/runner/**/user-data/logs/**
            ${{ runner.temp }}/packaged-draft-result/runner/**/workspace/probe-*.json
            ${{ runner.temp }}/packaged-draft-result/runner/**/workspace/.vscode/settings.json
            ${{ runner.temp }}/packaged-draft-result/runner/**/user-data/User/settings.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  api-compatibility:
    name: API package compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify API release inputs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/api-changed-files"
          if grep -Eq '^(src/(api|types|publicErrors|capabilities|legacyCapabilities)\.ts$|api/(package(-lock)?\.json$|runtime/|scripts/|test/|tsconfig|\.npmignore$)|\.github/workflows/pr-(check|file-check)\.yml$|build/azure-pipeline\.npm\.yml$)' "$RUNNER_TEMP/api-changed-files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: npm ci
        working-directory: api

      - name: Validate declared extension minimum
        if: steps.scope.outputs.relevant == 'true'
        run: npm run check:release
        working-directory: api

      - name: Build and test API package
        if: steps.scope.outputs.relevant == 'true'
        run: npm run compile && npm test
        working-directory: api

  build-vsix:
    name: Create VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build VSIX
        uses: ./.github/actions/build-vsix
        with:
          node_version: ${{ env.NODE_VERSION }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint -- api/runtime api/scripts api/test

  ts-unit-tests:
    name: TypeScript Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Tests
        run: npm run pretest

      - name: Localization
        run: npx @vscode/l10n-dev@latest export ./src

      - name: Run Tests
        run: npm run unittest

  smoke-tests:
    name: Smoke Tests
    runs-on: ${{ matrix.os }}
    needs: [build-vsix]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Python Environment Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'microsoft/python-environment-tools'
          path: 'python-env-tools-src'
          sparse-checkout: |
            crates
            Cargo.toml
            Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            python-env-tools-src/target
          key: ${{ runner.os }}-cargo-pet-${{ hashFiles('python-env-tools-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pet-

      - name: Build Python Environment Tools
        run: cargo build --release --package pet
        working-directory: python-env-tools-src

      - name: Copy pet binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet python-env-tools/bin/
          chmod +x python-env-tools/bin/pet

      - name: Copy pet binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet.exe python-env-tools/bin/
        shell: bash

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Compile Tests
        run: npm run compile-tests

      - name: Run Smoke Tests (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/run-linux-tests
        with:
          script: smoke-test
          artifact-name: smoke-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_attempt }}

      - name: Run Smoke Tests (non-Linux)
        if: runner.os != 'Linux'
        run: npm run smoke-test

  e2e-tests:
    name: E2E Tests
    runs-on: ${{ matrix.os }}
    needs: [smoke-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Python Environment Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'microsoft/python-environment-tools'
          path: 'python-env-tools-src'
          sparse-checkout: |
            crates
            Cargo.toml
            Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            python-env-tools-src/target
          key: ${{ runner.os }}-cargo-pet-${{ hashFiles('python-env-tools-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pet-

      - name: Build Python Environment Tools
        run: cargo build --release --package pet
        working-directory: python-env-tools-src

      - name: Copy pet binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet python-env-tools/bin/
          chmod +x python-env-tools/bin/pet

      - name: Copy pet binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet.exe python-env-tools/bin/
        shell: bash

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Compile Tests
        run: npm run compile-tests

      - name: Run E2E Tests (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/run-linux-tests
        with:
          script: e2e-test
          artifact-name: e2e-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_attempt }}

      - name: Run E2E Tests (non-Linux)
        if: runner.os != 'Linux'
        run: npm run e2e-test

  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    needs: [smoke-tests]
    env:
      CONDA_PLUGINS_AUTO_ACCEPT_TOS: 'true'
      VSC_PYTHON_PACKAGE_NETWORK_TEST: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Python Environment Tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'microsoft/python-environment-tools'
          path: 'python-env-tools-src'
          sparse-checkout: |
            crates
            Cargo.toml
            Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            python-env-tools-src/target
          key: ${{ runner.os }}-cargo-pet-${{ hashFiles('python-env-tools-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pet-

      - name: Build Python Environment Tools
        run: cargo build --release --package pet
        working-directory: python-env-tools-src

      - name: Copy pet binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet python-env-tools/bin/
          chmod +x python-env-tools/bin/pet

      - name: Copy pet binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p python-env-tools/bin
          cp python-env-tools-src/target/release/pet.exe python-env-tools/bin/
        shell: bash

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Compile Tests
        run: npm run compile-tests

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: ''
          auto-activate: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Run Integration Tests (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/run-linux-tests
        with:
          script: integration-test
          artifact-name: integration-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_attempt }}

      - name: Run Integration Tests (non-Linux)
        if: runner.os != 'Linux'
        run: npm run integration-test

  integration-tests-multiroot:
    name: Integration Tests (Multi-Root)
    runs-on: ${{ matrix.os }}
    needs: [smoke-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Compile Tests
        run: npm run compile-tests

      - name: Run Integration Tests Multi-Root (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/run-linux-tests
        with:
          script: integration-test-multiroot
          artifact-name: integration-multiroot-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_attempt }}

      - name: Run Integration Tests Multi-Root (non-Linux)
        if: runner.os != 'Linux'
        run: npm run integration-test-multiroot

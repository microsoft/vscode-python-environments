name: Issue flag follow-up

on:
  issues:
    types: [labeled]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number with a recent central-bot flag; omit for catch-up
        required: false
        type: string

permissions: {}

concurrency:
  group: issue-followup-routing-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  candidates:
    if: >-
      github.event_name != 'issues' ||
      (github.event.sender.login == 'vs-code-engineering[bot]' &&
       contains(fromJSON('["~spam", "~info-needed"]'), github.event.label.name))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Select verified central-bot flags
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('node:path');
            const { planFollowups } = require(path.resolve('.github', 'scripts', 'issue-moderation.cjs'));
            const { candidates, truncated } = await planFollowups({ github, context });
            if (truncated) core.warning('Catch-up scan or batch limit reached; additional flagged issues may need a manual replay.');
            for (const candidate of candidates) {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'issue-moderation.lock.yml',
                ref: context.payload.repository.default_branch,
                inputs: candidate,
              });
            }
            await core.summary.addRaw(`Dispatched ${candidates.length} verified central-bot flags for review.`).write();

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/api"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "skip package*.json"
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github_actions"
      - "skip package*.json"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "daily"
    cooldown:
      # Delay updates beyond the highest-risk window after a release.
      default-days: 14

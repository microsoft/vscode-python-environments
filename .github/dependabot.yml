version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github_actions"
      - "skip package*.json"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      # Delay updates beyond the highest-risk window after a release.
      default-days: 14

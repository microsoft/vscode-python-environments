[project]
name = "package_name"
version = "1.0.0"
description = "" #TODO: Add a short description of your FastAPI project
authors = [{name = "Your Name", email = "your@email.com"}] #TODO: Add your name and email
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]
dynamic = ["optional-dependencies"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
optional-dependencies = {dev = {file = ["dev-requirements.txt"]}} # add packages for development in the dev-requirements.txt file

[project.scripts]
package_name = "package_name.__main__:main"

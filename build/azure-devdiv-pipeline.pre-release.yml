# Run on a schedule
trigger: none
pr: none

schedules:
  - cron: '0 10 * * 1-5' # 10AM UTC (2AM PDT) MON-FRI (VS Code Pre-release builds at 9PM PDT)
    displayName: Nightly Pre-Release Schedule
    always: false # only run if there are source code changes
    branches:
      include:
        - main

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/pylance-eng
      ref: refs/heads/main
      endpoint: Github-Pylance
    - repository: translations
      type: github
      name: microsoft/vscode-python-extensions-loc
      # Temporarily use dev while the localization force-push issue is resolved.
      ref: refs/heads/dev
      endpoint: Github-Pylance
    - repository: localizationTools
      type: github
      name: microsoft/vscode-python-ci
      ref: f078b68e968b56e0a22d6cf803bb241a6b094994
      endpoint: Github-Pylance

variables:
  - name: TeamName
    value: VSCode-python-environments
  - name: VsixName
    value: python-environments.vsix
  - name: NodeVersion
    value: '22.21.1'
  - name: AZURE_ARTIFACTS_FEED
    value: 'https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/Pylance_PublicPackages/npm/registry/'

parameters:
  - name: publishExtension
    displayName: 🚀 Publish Extension
    type: boolean
    default: true

  - name: buildPlatforms
    type: object
    default:
      - name: Linux
        vsceTarget: web
      - name: Linux
        vsceTarget: linux-arm64
      - name: Linux
        vsceTarget: linux-armhf
      - name: Linux
        vsceTarget: linux-x64
      - name: Linux
        vsceTarget: alpine-arm64
      - name: Linux
        vsceTarget: alpine-x64
      - name: MacOS
        vsceTarget: darwin-arm64
      - name: MacOS
        vsceTarget: darwin-x64
      - name: Windows
        vsceTarget: win32-arm64
      - name: Windows
        vsceTarget: win32-x64

  - name: buildSteps
    type: stepList
    default:
      - script: npm ci
        displayName: Install NPM dependencies

      - script: python ./build/update_package_json.py
        displayName: Update telemetry in package.json

      - script: python ./build/update_ext_version.py --for-publishing
        displayName: Validate version number

      - bash: |
          case "$(vsceTarget)" in
            win32-x64) target=x86_64-pc-windows-msvc ;;
            win32-arm64) target=aarch64-pc-windows-msvc ;;
            linux-x64|alpine-x64|web) target=x86_64-unknown-linux-musl ;;
            linux-arm64|alpine-arm64) target=aarch64-unknown-linux-gnu ;;
            linux-armhf) target=armv7-unknown-linux-gnueabihf ;;
            darwin-x64) target=x86_64-apple-darwin ;;
            darwin-arm64) target=aarch64-apple-darwin ;;
            *) echo "Unsupported VS Code target: $(vsceTarget)" >&2; exit 1 ;;
          esac
          echo "##vso[task.setvariable variable=buildTarget]$target"
        displayName: Select PET build target

      - task: DownloadPipelineArtifact@2
        displayName: Download PET
        inputs:
          buildType: specific
          project: DevDiv
          definition: 28980
          buildVersionToDownload: latestFromBranch
          branchName: refs/heads/main
          targetPath: $(Build.SourcesDirectory)/python-env-tools/bin
          artifactName: bin-$(buildTarget)
          itemPattern: |
            pet.exe
            pet
            ThirdPartyNotices.txt

      - bash: |
          set -euo pipefail
          cd "$(Build.SourcesDirectory)/python-env-tools/bin"
          if [ -f pet ]; then
            chmod +x pet
          elif [ ! -f pet.exe ]; then
            echo "PET binary is missing from the downloaded artifact" >&2
            exit 1
          fi
          test -f ThirdPartyNotices.txt
        displayName: Verify PET artifact

      - script: npm run package
        displayName: Build extension

extends:
  template: azure-pipelines/extension/pre-release.yml@templates
  parameters:
    buildPlatforms: ${{ parameters.buildPlatforms }}
    buildSteps: ${{ parameters.buildSteps }}
    standardizedVersioning: true
    customNPMRegistry: $(AZURE_ARTIFACTS_FEED)
    nodeVersion: $(NodeVersion)
    publishExtension: ${{ parameters.publishExtension }}
    teamName: $(TeamName)
    ghCreateTag: true
    ghCreateRelease: true
    ghReleaseAddChangeLog: true
    sourceAnalysisPool: VSEng-MicroBuildVSStable
    pullLocalization: true

# Run on a schedule
trigger: none
pr: none

schedules:
  - cron: '0 10 * * 1-5' # 10AM UTC (2AM PDT) MON-FRI (VS Code Pre-release builds at 9PM PDT)
    displayName: Nightly Pre-Release Schedule
    always: false # only run if there are source code changes
    branches:
      include:
        - main

resources:
  repositories:
    - repository: templates
      type: git
      name: DevDiv/Pylance-Eng
      ref: refs/heads/users/bschnurr/localization-wrapper
    - repository: translations
      type: github
      name: microsoft/vscode-python-extensions-loc
      ref: refs/heads/dev
      endpoint: Github-Pylance
    - repository: localizationTools
      type: github
      name: microsoft/vscode-common-python-lsp
      ref: d1877b84bb10ff7caa6bd12ab4e75498ba760790
      endpoint: Github-Pylance

variables:
  - name: TeamName
    value: VSCode-python-environments
  - name: VsixName
    value: python-environments.vsix
  - name: NodeVersion
    value: '22.21.1'
  - name: AZURE_ARTIFACTS_FEED
    value: 'https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/Pylance_PublicPackages/npm/registry/'

parameters:
  - name: publishExtension
    displayName: ðŸš€ Publish Extension
    type: boolean
    default: true

  - name: buildPlatforms
    type: object
    default:
      - name: Linux
        vsceTarget: web
      - name: Linux
        vsceTarget: linux-arm64
      - name: Linux
        vsceTarget: linux-armhf
      - name: Linux
        vsceTarget: linux-x64
      - name: Linux
        vsceTarget: alpine-arm64
      - name: Linux
        vsceTarget: alpine-x64
      - name: MacOS
        vsceTarget: darwin-arm64
      - name: MacOS
        vsceTarget: darwin-x64
      - name: Windows
        vsceTarget: win32-arm64
      - name: Windows
        vsceTarget: win32-x64

  - name: buildSteps
    type: stepList
    default:
      - script: npm ci
        displayName: Install NPM dependencies

      - script: python ./build/update_package_json.py
        displayName: Update telemetry in package.json

      - script: python ./build/update_ext_version.py --for-publishing
        displayName: Validate version number

      - script: npm run package
        displayName: Build extension

extends:
  template: azure-pipelines/extension/pre-release.yml@templates
  parameters:
    buildPlatforms: ${{ parameters.buildPlatforms }}
    buildSteps: ${{ parameters.buildSteps }}
    standardizedVersioning: true
    customNPMRegistry: $(AZURE_ARTIFACTS_FEED)
    nodeVersion: $(NodeVersion)
    publishExtension: ${{ parameters.publishExtension }}
    teamName: $(TeamName)
    ghCreateTag: true
    ghCreateRelease: true
    ghReleaseAddChangeLog: true
    sourceAnalysisPool: VSEng-MicroBuildVSStable
    pullLocalization: true
